# Lowest acceptable prices ("BATNA") for every unit -- ONE list for all three price tools:
#   - the price changes page (price-session), read from this file on GitHub
#   - the 5% program (5percent-price-change-pricelabs, run by five-percent-run), read from this file on GitHub
#   - the old price page (this repo, app/app_2.py via utils/backend_interface.get_batna_for_listing)
# Change a price HERE ONLY. The `batna` fields in config/properties.yaml and in the 5% program's
# properties_config.yaml are only used for a unit that is missing from this list.
#
# Source: Katarina's Google Doc "BATNA Document"
#   https://docs.google.com/document/d/1k1n-wQ967FCOSvxpwC7U8rn7rxFlgNxHYPiDJtvjs7w
#   copied 28 Oct 2026 (doc last edited 16 Oct 2026). She approved one shared list (late Oct 2026).
#
# Each unit (by its PriceLabs listing id) has a list of rules. The FIRST rule that fits the night wins:
#   months: [11, 12, 1, 2]        only nights in these months
#   start / end: "2026-12-01"     only nights between these dates (both included)
#   days: [fri, sat]              only these days of the week
#   batna: 209                    the lowest price
#   week: [mon, tue, wed, thu, fri, sat, sun]   instead of batna: a lowest price for each day of the week
# Every unit's last rule has no condition, so every night has a lowest price.
#
# Day groups (her doc, same as src/pricing_engine/utils.get_day_group): Mon-Wed, Thu-Sun = Thursday + Sunday, Fri-Sat.
# LaFave seasons (her doc + her answer 16 Oct 2026): low = Nov-Feb, high = Mar-Jun + Sep-Oct, summer = Jul-Aug.

